# Shipped Sylva defaults. Override in .sylva/config (any key) or, for
# machine/secrets only, in .env: host, port, server_addr, server_url,
# tailscale_authkey, master_passphrase.

service_name=sylvad
backend=self-hosted
profile=default
git_remote=
git_branch=main
git_timeout=30s
git_cache_dir=.sylva/git
version=0.1.0-dev
log_level=info

host=127.0.0.1
port=8443
scheme=http
api_prefix=/api/v1
server_addr=
server_url=

server_read_header_timeout=5s
server_read_timeout=10s
server_write_timeout=10s
server_idle_timeout=60s
server_shutdown_timeout=5s
client_timeout=5s
# Encoded JSON: one record/metadata vs. a complete list/snapshot.
max_body_bytes=1048576
max_vault_bytes=67108864
# Backup adds an authenticated wrapper and another base64 encoding layer.
max_backup_bytes=134217728

server_db_path=.sylva/sylvad.db
client_cache_enabled=true
client_cache_path=.sylva/cache.db
sqlite_busy_timeout=5s
record_initial_version=1

kdf_time=3
kdf_memory_kb=65536
kdf_threads=4
kdf_key_len=32
kdf_salt_len=16
password_default_len=24

clipboard_clear_after=20s
clipboard_backend=auto
clipboard_file=

agent_enabled=true
agent_idle_timeout=15m
agent_request_timeout=5s
agent_max_request_bytes=1048576
agent_max_connections=64
agent_socket_path=.sylva/agent.sock
agent_log_path=.sylva/agent.log

keyring_enabled=false
keyring_service=sylva
keyring_user=master

ssh_unlock_dir=.sylva/ssh

ca_cert_path=.sylva/certs/ca.pem
server_cert_path=.sylva/certs/server.pem
server_key_path=.sylva/certs/server.key
client_cert_path=.sylva/certs/client.pem
client_key_path=.sylva/certs/client.key

tailscale_node=sylva
tailscale_state_dir=.sylva/tsnet
tailscale_tags=
