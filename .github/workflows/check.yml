name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Analyze formatting, values and resource lifecycles
        run: make analyze

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check reachable vulnerabilities
        run: make security

  test:
    name: Race tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race and goroutine lifecycle tests with coverage
        run: make coverage
      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -s .coverage/coverage.txt ]; then
            {
              echo '### Test coverage'
              echo '```text'
              cat .coverage/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .coverage/coverage.out
            .coverage/coverage.txt
            .coverage/coverage.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  fuzz:
    name: Crypto fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz crypto boundaries
        run: make fuzz FUZZTIME=5s

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Meson and Ninja
        run: python3 -m pip install meson==1.9.1 ninja==1.13.0
      - name: Build
        run: make build

  docker-e2e:
    name: Docker mTLS and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test mTLS, passphrase rotation, backup and restore
        run: make docker-e2e

  check:
    name: check
    if: ${{ always() }}
    needs: [analysis, security, test, fuzz, build, docker-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ -z "$RESULTS" ]; then
            echo "Missing required job results"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job failed, was canceled, or was skipped: $RESULTS"
              exit 1
            fi
          done
