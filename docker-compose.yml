services:
  test:
    build:
      context: .
      target: test
      args:
        GO_IMAGE: ${SYLVA_DOCKER_GO_IMAGE}
        TEST_IMAGE: ${SYLVA_DOCKER_TEST_IMAGE}
        RUNTIME_IMAGE: ${SYLVA_DOCKER_RUNTIME_IMAGE}
        GOTOOLCHAIN: ${SYLVA_GOTOOLCHAIN}
    env_file:
      - .env

  sylvad:
    build:
      context: .
      target: sylvad
      args:
        GO_IMAGE: ${SYLVA_DOCKER_GO_IMAGE}
        TEST_IMAGE: ${SYLVA_DOCKER_TEST_IMAGE}
        RUNTIME_IMAGE: ${SYLVA_DOCKER_RUNTIME_IMAGE}
    env_file:
      - .env
    environment:
      SYLVA_HOST: 0.0.0.0
      SYLVA_SERVER_DB_PATH: /data/sylvad.db
    volumes:
      - sylvad-data:/data
    ports:
      - "${SYLVA_HOST}:${SYLVA_PORT}:${SYLVA_PORT}"
    networks:
      - sylva-net

  sylva:
    build:
      context: .
      target: sylva
      args:
        GO_IMAGE: ${SYLVA_DOCKER_GO_IMAGE}
        TEST_IMAGE: ${SYLVA_DOCKER_TEST_IMAGE}
        RUNTIME_IMAGE: ${SYLVA_DOCKER_RUNTIME_IMAGE}
    env_file:
      - .env
    environment:
      SYLVA_HOST: sylvad
      SYLVA_CLIENT_CACHE_PATH: /tmp/sylva-cache.db
      SYLVA_CLIPBOARD_BACKEND: memory
    depends_on:
      - sylvad
    networks:
      - sylva-net

networks:
  sylva-net:
    driver: bridge

volumes:
  sylvad-data:
