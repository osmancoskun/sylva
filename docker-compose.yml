services:
  test:
    build:
      context: .
      network: host
      target: test

  sylvad:
    build:
      context: .
      network: host
      target: sylvad
    env_file:
      - .env
    environment:
      SYLVA_HOST: 0.0.0.0
      SYLVA_SERVER_DB_PATH: /data/sylvad.db
    volumes:
      - sylvad-data:/data
    ports:
      - "${SYLVA_PORT}:${SYLVA_PORT}"
    networks:
      - sylva-net

  sylva:
    build:
      context: .
      network: host
      target: sylva
    env_file:
      - .env
    environment:
      SYLVA_HOST: sylvad
      SYLVA_CLIENT_CACHE_PATH: /tmp/sylva-cache.db
      SYLVA_CLIPBOARD_BACKEND: memory
    depends_on:
      - sylvad
    networks:
      - sylva-net

networks:
  sylva-net:
    driver: bridge

volumes:
  sylvad-data:
