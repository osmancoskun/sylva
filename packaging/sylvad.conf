# Packaged service settings. Other keys use the embedded defaults.
# For remote access, configure mTLS or Tailscale before changing the address.
host=127.0.0.1
port=8443
server_db_path=/var/lib/sylva/sylvad.db
tailscale_state_dir=/var/lib/sylva/tsnet
ca_cert_path=/etc/sylva/certs/ca.pem
server_cert_path=/etc/sylva/certs/server.pem
server_key_path=/etc/sylva/certs/server.key
