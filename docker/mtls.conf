# Container connections always require mutual TLS, including the bridge network.
mtls=true
ca_cert_path=/run/sylva/certs/ca.pem
server_cert_path=/run/sylva/certs/server.pem
server_key_path=/run/sylva/certs/server.key
client_cert_path=/run/sylva/certs/client.pem
client_key_path=/run/sylva/certs/client.key
